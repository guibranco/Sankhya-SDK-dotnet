name: Release

on:
  push:
    branches:
      - main

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_NOLOGO: true

jobs:
  release:
    name: Build · Test · Package · Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
      id-token: write

    steps:
      # ── Checkout ─────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # ── Toolchain ────────────────────────────────────────────────────────────
      # The library multi-targets up to net9.0 and the tests run on net8.0,
      # so both SDK/runtime lines are installed explicitly.
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Setup Java 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"

      # ── GitVersion ───────────────────────────────────────────────────────────
      - name: Install GitVersion
        uses: gittools/actions/gitversion/setup@7417b1089e2c7de93510f1901d656ddf60bb024f # v4
        with:
          versionSpec: "6.x"

      - name: Determine version
        id: gitversion
        uses: gittools/actions/gitversion/execute@7417b1089e2c7de93510f1901d656ddf60bb024f # v4

      - name: Patch .props files with computed version
        run: |
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          ASSEMBLY_VERSION="${{ steps.gitversion.outputs.assemblySemVer }}"
          echo "Patching version → $VERSION (assembly: $ASSEMBLY_VERSION)"
          find . -name "*.props" -print0 | xargs -0 sed -i \
            -e "s|<Version>[^<]*</Version>|<Version>$VERSION</Version>|g" \
            -e "s|<PackageVersion>[^<]*</PackageVersion>|<PackageVersion>$VERSION</PackageVersion>|g" \
            -e "s|<AssemblyVersion>[^<]*</AssemblyVersion>|<AssemblyVersion>$ASSEMBLY_VERSION</AssemblyVersion>|g" \
            -e "s|<FileVersion>[^<]*</FileVersion>|<FileVersion>$ASSEMBLY_VERSION</FileVersion>|g" \
            -e "s|<InformationalVersion>[^<]*</InformationalVersion>|<InformationalVersion>$VERSION</InformationalVersion>|g"

      # ── Resolve solution name and target frameworks ──────────────────────────
      # Target frameworks come straight from Directory.Build.props so this
      # workflow never carries a hardcoded TFM list that can go stale.
      - name: Resolve solution name and target frameworks
        id: solution
        run: |
          SLN=$(find . -maxdepth 2 -name "*.sln" | head -1 | xargs basename -s .sln)
          TFMS=$(grep -oPm1 '(?<=<DotNetVersions>)[^<]+' Directory.Build.props | tr ';' ' ')
          echo "name=$SLN" >> "$GITHUB_OUTPUT"
          echo "tfms=$TFMS" >> "$GITHUB_OUTPUT"
          echo "Solution: $SLN"
          echo "Target frameworks: $TFMS"

      # ── Install global tools ──────────────────────────────────────────────────
      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Install DeepSource scanner
        run: |
          curl --proto '=https' --tlsv1.2 -fsSLo deepsource-install.sh https://deepsource.io/cli
          sh deepsource-install.sh

      - name: Restore NuGet packages
        run: dotnet restore

      # ── SonarCloud: begin ─────────────────────────────────────────────────────
      - name: SonarCloud – begin scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          SLN="${{ steps.solution.outputs.name }}"
          VERSION="${{ steps.gitversion.outputs.assemblySemVer }}"
          PROJECT="${GITHUB_REPOSITORY/\//_}"
          ORG="${GITHUB_REPOSITORY_OWNER}"

          dotnet sonarscanner begin \
            "/k:$PROJECT" \
            "/o:$ORG" \
            "/v:$VERSION" \
            "/d:sonar.host.url=https://sonarcloud.io" \
            "/d:sonar.token=$SONAR_TOKEN" \
            "/d:sonar.scanner.scanAll=false" \
            "/d:sonar.branch.name=main" \
            "/d:sonar.exclusions=**/bin/**/*,**/obj/**/*" \
            "/d:sonar.coverage.exclusions=**/${SLN}.Tests/**,**/*Tests.cs" \
            "/d:sonar.cs.opencover.reportsPaths=Tests/${SLN}.Tests/coverage.*.opencover.xml"

      # ── Build ─────────────────────────────────────────────────────────────────
      - name: Build
        run: dotnet build --no-restore --configuration Release --verbosity minimal ${{ steps.solution.outputs.name }}.sln

      # ── Test + coverage ───────────────────────────────────────────────────────
      - name: Test with coverage
        run: |
          for TEST_PROJ in $(find ./Tests -name "*.csproj" -type f); do
            dotnet test "$TEST_PROJ" \
              --no-build \
              --configuration Release \
              --verbosity minimal \
              /p:CollectCoverage=true \
              /p:CoverletOutputFormat='"cobertura,opencover,lcov"' \
              --logger:"junit;LogFilePath=test-results.xml"
          done

      - name: Publish test results
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: Tests/**/test-results.xml

      # Coverlet names its output after the test target framework
      # (coverage.net8.0.opencover.xml today), so the paths are resolved at
      # run time instead of being hardcoded and going stale on the next TFM bump.
      - name: Locate coverage reports
        id: coverage
        run: |
          SLN="${{ steps.solution.outputs.name }}"
          OPENCOVER=$(find "Tests/${SLN}.Tests" -name 'coverage.*.opencover.xml' -o -name 'coverage.opencover.xml' | head -1)
          COBERTURA=$(find "Tests/${SLN}.Tests" -name 'coverage.*.cobertura.xml' -o -name 'coverage.cobertura.xml' | head -1)
          echo "opencover=$OPENCOVER" >> "$GITHUB_OUTPUT"
          echo "cobertura=$COBERTURA" >> "$GITHUB_OUTPUT"
          echo "OpenCover: $OPENCOVER"
          echo "Cobertura: $COBERTURA"

      # ── Coverage reporting ────────────────────────────────────────────────────
      - name: Report coverage → Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ${{ steps.coverage.outputs.opencover }}
          fail_ci_if_error: false

      - name: Report coverage → Codacy
        env:
          CODACY_PROJECT_TOKEN: ${{ secrets.CODACY_PROJECT_TOKEN }}
        run: |
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://github.com/codacy/codacy-coverage-reporter/releases/latest/download/codacy-coverage-reporter-assembly.jar \
            -o codacy-reporter.jar
          java -jar codacy-reporter.jar report \
            -l CSharp \
            -t "$CODACY_PROJECT_TOKEN" \
            -r "${{ steps.coverage.outputs.opencover }}"

      - name: Report coverage → DeepSource
        env:
          DEEPSOURCE_DSN: ${{ secrets.DEEPSOURCE_DSN }}
        run: |
          ./bin/deepsource report \
            --analyzer test-coverage \
            --key csharp \
            --value-file "${{ steps.coverage.outputs.cobertura }}"

      # ── SonarCloud: end ───────────────────────────────────────────────────────
      - name: SonarCloud – end scan
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

      # ═══════════════════════════════════════════════════════════════════════════
      # RELEASE PHASE – everything below runs only after a clean green build/test
      # ═══════════════════════════════════════════════════════════════════════════

      # ── Collect binary artifacts ──────────────────────────────────────────────
      # A missing TFM output fails the run on purpose: shipping an empty zip
      # would otherwise go unnoticed until someone downloads the release.
      - name: Collect binary artifacts
        run: |
          SLN="${{ steps.solution.outputs.name }}"
          mkdir -p Artifacts/Coverage

          for TFM in ${{ steps.solution.outputs.tfms }}; do
            SRC="Src/${SLN}/bin/Release/${TFM}"
            DST="Artifacts/Build/Core/${TFM}"
            if [ ! -d "$SRC" ]; then
              echo "::error::Build output for ${TFM} not found at ${SRC}"
              exit 1
            fi
            mkdir -p "$DST"
            rsync -a --exclude="refs/" "$SRC/" "$DST/"
          done

          # Coverage reports
          cp Tests/${SLN}.Tests/*.xml  Artifacts/Coverage/ 2>/dev/null || true
          cp Tests/${SLN}.Tests/*.json Artifacts/Coverage/ 2>/dev/null || true
          cp Tests/${SLN}.Tests/*.info Artifacts/Coverage/ 2>/dev/null || true

      # ── Compress release zips ─────────────────────────────────────────────────
      - name: Compress release archives
        run: |
          SLN="${{ steps.solution.outputs.name }}"
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          mkdir -p Zips

          # Coverage archive
          zip -9 -r "Zips/${SLN}.${VERSION}.Coverage.zip" Artifacts/Coverage/

          # Per-TFM binary archives
          for TFM in ${{ steps.solution.outputs.tfms }}; do
            zip -9 -r "Zips/${SLN}.Core.${TFM}.${VERSION}.zip" \
              "Artifacts/Build/Core/${TFM}/"
          done

      # ── Collect NuGet packages ────────────────────────────────────────────────
      - name: Collect NuGet packages
        run: |
          SLN="${{ steps.solution.outputs.name }}"
          VERSION="${{ steps.gitversion.outputs.semVer }}"
          mkdir -p Zips

          cp "Src/${SLN}/bin/Release/${SLN}.${VERSION}.nupkg"  Zips/ 2>/dev/null || true
          cp "Src/${SLN}/bin/Release/${SLN}.${VERSION}.snupkg" Zips/ 2>/dev/null || true

      # ── Push packages to NuGet.org ────────────────────────────────────────────
      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          shopt -s nullglob
          PACKAGES=(Zips/*.nupkg)
          if [ ${#PACKAGES[@]} -eq 0 ]; then
            echo "::error::No .nupkg files found in Zips/ — check the build/pack steps above."
            exit 1
          fi
          for PKG in "${PACKAGES[@]}"; do
            echo "Publishing $PKG …"
            dotnet nuget push "$PKG" \
              --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json \
              --skip-duplicate
          done

      # ── Tag the release commit ────────────────────────────────────────────────
      # This tag is what GitVersion reads on the next run to derive the next
      # version increment, so it must be pushed before any subsequent builds.
      - name: Tag release version
        run: |
          VERSION="v${{ steps.gitversion.outputs.semVer }}"
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$VERSION" -m "Release $VERSION"
          git push origin "$VERSION"

      # ── Create GitHub Release ─────────────────────────────────────────────────
      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: v${{ steps.gitversion.outputs.semVer }}
          name: Release v${{ steps.gitversion.outputs.semVer }}
          body: Release of ${{ steps.solution.outputs.name }} - v${{ steps.gitversion.outputs.semVer }}
          generate_release_notes: true  # auto-generates changelog from merged PRs
          fail_on_unmatched_files: false
          files: Zips/*
